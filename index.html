<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ավտո Հայաստան — Free car listings in Armenia</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--txt:#14161a;--mut:#6b7280;--acc:#0f7a3d;--acc2:#0c5f30;--line:#e5e7eb;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:76px}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px;border-radius:8px}
header.top{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:19px;color:var(--acc);white-space:nowrap}
.logo small{display:block;font-size:10px;color:var(--mut);font-weight:400}
.hdr-sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:active{background:var(--acc2)}
.btn.block{width:100%;padding:13px;font-size:16px}
.btn.danger{background:#dc2626;border-color:#dc2626;color:#fff}
.langseg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.langseg button{border:0;background:transparent;padding:8px 10px;font-weight:700;color:var(--mut)}
.langseg button.on{background:var(--acc);color:#fff}
main{max-width:860px;margin:0 auto;padding:12px 12px 20px}
.searchbar{display:flex;gap:8px;margin-bottom:10px}
.searchbar input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chip.on{background:var(--txt);color:#fff;border-color:var(--txt)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.card img.ph{width:100%;aspect-ratio:4/3;object-fit:cover;background:#e8eaed}
.card .pad{padding:10px}
.card .t{font-weight:700;font-size:14px;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .p{font-weight:800;color:var(--acc);font-size:15px}
.card .p small{color:var(--mut);font-weight:400;font-size:12px}
.card .m{color:var(--mut);font-size:12px;margin-top:2px}
.detail img.hero{width:100%;aspect-ratio:4/3;object-fit:cover;background:#e8eaed;border-radius:var(--r)}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:10px 0}
.thumbs img{width:76px;height:57px;object-fit:cover;border-radius:8px;border:2px solid transparent}
.thumbs img.on{border-color:var(--acc)}
.specs{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px;margin:12px 0}
.specs .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.specs .row:last-child{border:0}
.specs .k{color:var(--mut)}
.price-big{font-size:26px;font-weight:800;color:var(--acc)}
.price-big small{display:block;font-size:14px;color:var(--mut);font-weight:400}
.form{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.fld{margin-bottom:12px}
.fld label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;font-family:inherit;background:#fff}
.fld textarea{min-height:90px;resize:vertical}
.fld .hint{font-size:12px;color:var(--mut);margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phprev{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.phprev img{width:72px;height:54px;object-fit:cover;border-radius:8px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
nav.tabs button .ic{font-size:20px}
nav.tabs button.on{color:var(--acc)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:18px}}
.authtabs{display:flex;gap:8px;margin-bottom:14px}
.authtabs button{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#14161a;color:#fff;padding:12px 18px;border-radius:12px;z-index:200;display:none;font-weight:600;max-width:90vw;text-align:center}
table.adm{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:14px}
table.adm th,table.adm td{padding:10px;border-bottom:1px solid var(--line);text-align:left}
table.adm th{background:#f8fafc;color:var(--mut);font-size:12px}
.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat b{font-size:24px;display:block}
.stat span{font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.vid{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;margin:12px 0}
.vid iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#/" aria-label="home">🚗 Ավտո Հայաստան<small id="logo-sub">free car listings</small></a>
  <span class="hdr-sp"></span>
  <div class="langseg" role="group" aria-label="language">
    <button id="lang-hy" class="on">Հայ</button><button id="lang-en">EN</button>
  </div>
  <button class="btn" id="auth-btn">Մուտք</button>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabs" aria-label="main">
  <button data-go="#/" class="on"><span class="ic">🏠</span><span data-t="home">Գլխավոր</span></button>
  <button data-go="#/post"><span class="ic">➕</span><span data-t="post">Տեղադրել</span></button>
  <button data-go="#/my"><span class="ic">📋</span><span data-t="my">Իմը</span></button>
  <button data-go="#/admin" id="tab-admin" style="display:none"><span class="ic">⚙️</span><span data-t="admin">Ադմին</span></button>
</nav>
<div class="modal" id="auth-modal" role="dialog" aria-modal="true" aria-label="auth">
  <div class="sheet">
    <div class="authtabs">
      <button class="btn pri" id="tab-email">📧 Email</button>
      <button class="btn" id="tab-phone">📱 <span data-t="phone">Հեռախոս</span></button>
    </div>
    <div id="pane-email">
      <div class="fld"><label data-t="email">Էլ. փոստ</label><input id="in-email" type="email" autocomplete="email" placeholder="you@mail.com"></div>
      <div class="fld"><label data-t="password">Գաղտնաբառ</label><input id="in-pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="btn pri block" id="btn-email-go" data-t="login">Մուտք</button>
      <p class="hint" style="text-align:center;margin-top:10px"><a href="#" id="link-signup" data-t="noaccount">Դեռ գրանցված չե՞ք — Գրանցվել</a></p>
    </div>
    <div id="pane-phone" style="display:none">
      <div class="fld"><label data-t="phone">Հեռախոս</label><input id="in-phone" type="tel" autocomplete="tel" placeholder="+374 77 123456"></div>
      <div id="recaptcha"></div>
      <button class="btn pri block" id="btn-sms-go" data-t="sendsms">Ուղարկել SMS կոդ</button>
      <div class="fld" id="sms-code-wrap" style="display:none;margin-top:12px"><label data-t="smscode">SMS կոդ</label><input id="in-smscode" inputmode="numeric" placeholder="123456"></div>
      <button class="btn pri block" id="btn-sms-verify" style="display:none;margin-top:10px" data-t="verify">Հաստատել</button>
    </div>
    <button class="btn block" id="auth-close" style="margin-top:12px" data-t="close">Փակել</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
'use strict';
/* ============ i18n ============ */
const T = {
hy:{home:'Գլխավոր',post:'Տեղադրել',my:'Իմը',admin:'Ադմին',search:'Որոնում…',all:'Բոլորը',login:'Մուտք',logout:'Ելք',close:'Փակել',phone:'Հեռախոս',email:'Էլ. փոստ',password:'Գաղտնաբառ',noaccount:'Դեռ գրանցված չե՞ք — Գրանցվել',haveaccount:'Արդեն գրանցվա՞ծ եք — Մուտք',sendsms:'Ուղարկել SMS կոդ',smscode:'SMS կոդ',verify:'Հաստատել',verifyemail:'Հաստատեք ձեր էլ. փոստը — հղում ենք ուղարկել',title:'Վերնագիր',make:'Մակնիշ',model:'Մոդել',year:'Տարի',price:'Գին (USD)',mileage:'Վազք',km:'կմ',mi:'մղոն',body:'Թափք',fuel:'Վառելիք',gearbox:'Փոխանցում',drive:'Քարշակ',color:'Գույն',desc:'Նկարագրություն',photos:'Լուսանկարներ (մինչև 6)',youtube:'YouTube հղում',publish:'Հրապարակել',save:'Պահպանել',del:'Ջնջել',edit:'Խմբագրել',views:'դիտում',call:'Զանգել',users:'Օգտատերեր',stats:'Վիճակագրություն',listings:'հայտարարություն',peruser:'Օգտատեր / հայտարարություններ',nousers:'Դեռ օգտատերեր չկան',nolistings:'Հայտարարություններ չկան',marksold:'Նշել որպես վաճառված',reactivate:'Վերականգնել',needlogin:'Նախ մուտք գործեք',posted:'Հրապարակված է ✓',deleted:'Ջնջված է',minyear:'Տարի (min)',maxprice:'Գին (max, USD)',filters:'Ֆիլտրեր',apply:'Կիրառել',reset:'Մաքրել',sold:'ՎԱՃԱՌՎԱԾ',contact:'Կապ',sellerdetails:'Վաճառող',free:'ԱՆՎՃԱՐ',freesub:'տեղադրիր քո մեքենան անվճար'},
en:{home:'Home',post:'Sell',my:'Mine',admin:'Admin',search:'Search…',all:'All',login:'Log in',logout:'Log out',close:'Close',phone:'Phone',email:'Email',password:'Password',noaccount:'No account yet? Sign up',haveaccount:'Have an account? Log in',sendsms:'Send SMS code',smscode:'SMS code',verify:'Verify',verifyemail:'Please verify your email — we sent you a link',title:'Title',make:'Make',model:'Model',year:'Year',price:'Price (USD)',mileage:'Mileage',km:'km',mi:'mi',body:'Body',fuel:'Fuel',gearbox:'Gearbox',drive:'Drive',color:'Color',desc:'Description',photos:'Photos (up to 6)',youtube:'YouTube link',publish:'Publish',save:'Save',del:'Delete',edit:'Edit',views:'views',call:'Call',users:'Users',stats:'Statistics',listings:'listings',peruser:'User / listings',nousers:'No users yet',nolistings:'No listings',marksold:'Mark as sold',reactivate:'Reactivate',needlogin:'Please log in first',posted:'Published ✓',deleted:'Deleted',minyear:'Year (min)',maxprice:'Price (max, USD)',filters:'Filters',apply:'Apply',reset:'Reset',sold:'SOLD',contact:'Contact',sellerdetails:'Seller',free:'FREE',freesub:'list your car for free'}
};
let LANG = localStorage.getItem('carlang') || 'hy';
const t = (k) => (T[LANG] && T[LANG][k]) || T.en[k] || k;
function applyI18n(){ document.querySelectorAll('[data-t]').forEach((el)=>{ el.textContent = t(el.dataset.t); }); document.getElementById('lang-hy').classList.toggle('on', LANG==='hy'); document.getElementById('lang-en').classList.toggle('on', LANG==='en'); document.documentElement.lang = LANG; }
</script>
<script>
'use strict';
/* ============ state + api ============ */
const S = { user:null, fbUser:null, token:null, config:null, fx:{rate:400}, makes:[], filters:{q:'',make:'',min_year:'',max_price:''}, cache:{} };
async function api(path, opts={}) {
  const h = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (S.token) h['Authorization'] = 'Bearer ' + S.token;
  const r = await fetch('/api' + path, { method: opts.method||'GET', headers:h, body: opts.body?JSON.stringify(opts.body):undefined });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('http '+r.status));
  return j;
}
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',2600); }
const escH = (s)=>String(s==null?'':s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtUSD = (n)=>'$'+Number(n||0).toLocaleString('en-US');
const fmtAMD = (n)=>Number(n||0).toLocaleString('hy-AM')+' ֏';
function ytId(url){ const m=String(url||'').match(/(?:v=|youtu\.be\/|embed\/)([\w-]{6,})/); return m?m[1]:null; }

/* ============ firebase ============ */
let fbApp=null, fbAuth=null, phoneConfirm=null, emailMode='login';
async function initFirebase(){
  if(!S.config) S.config = await api('/config').catch(()=>null);
  if(!S.config || !S.config.firebase || !S.config.firebase.apiKey) return false;
  if(!fbApp){ fbApp = firebase.initializeApp(S.config.firebase); fbAuth = firebase.auth(); }
  fbAuth.onAuthStateChanged(async (u)=>{
    S.fbUser = u;
    if(u){
      if(u.providerData.some(p=>p.providerId==='password') && !u.emailVerified){
        toast(t('verifyemail')); try{ await u.sendEmailVerification(); }catch(e){}
      }
      S.token = await u.getIdToken();
      try{ const me = await api('/me'); S.user = me.user; S.user.listings = me.listings; }
      catch(e){ S.user = null; }
    } else { S.token=null; S.user=null; }
    renderAuthBtn(); route();
  });
  return true;
}
function renderAuthBtn(){
  const b=document.getElementById('auth-btn');
  b.textContent = S.user ? t('logout') : t('login');
  document.getElementById('tab-admin').style.display = (S.user && S.user.is_admin) ? '' : 'none';
}
function openAuth(){ document.getElementById('auth-modal').classList.add('open'); const i=document.getElementById('in-email'); if(i) i.focus(); }
function closeAuth(){ document.getElementById('auth-modal').classList.remove('open'); }

/* ============ router ============ */
const view = document.getElementById('view');
function nav(h){ location.hash = h; }
function route(){
  const h = location.hash || '#/';
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.go===h.split('?')[0] || (h==='#/'&&b.dataset.go==='#/')));
  applyI18n(); renderAuthBtn();
  if(h.startsWith('#/l/')) return vDetail(h.slice(4));
  if(h.startsWith('#/post')) return vPost();
  if(h.startsWith('#/edit/')) return vPost(h.slice(6));
  if(h.startsWith('#/my')) return vMy();
  if(h.startsWith('#/admin')) return vAdmin();
  return vHome();
}
window.addEventListener('hashchange', route);

/* ============ home / search ============ */
function cardHTML(l){
  const img = l.photos && l.photos[0] ? '/api/photo/'+l.photos[0] : 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="400" height="300" fill="#e8eaed"/><text x="200" y="160" font-size="40" text-anchor="middle" fill="#9aa0a6">🚗</text></svg>');
  return `<a class="card" href="#/l/${escH(l.id)}" aria-label="${escH(l.title)}">
    <img class="ph" src="${img}" alt="" loading="lazy">
    <div class="pad"><p class="t">${escH(l.title)}</p>
    <div class="p">${fmtUSD(l.price_usd)} <small>· ${fmtAMD(l.price_amd)}</small></div>
    <div class="m">${escH(l.year||'')} · ${escH(l.mileage?Number(l.mileage).toLocaleString():'')} ${escH(l.mileage_unit==='mi'?t('mi'):t('km'))}</div></div></a>`;
}
async function vHome(){
  if(!S.makes.length){ try{ S.makes = (await api('/makes')).makes; }catch(e){} }
  try{ S.fx = await api('/fx'); }catch(e){}
  view.innerHTML = `
    <div class="searchbar" role="search">
      <input id="q" type="search" placeholder="${t('search')}" value="${escH(S.filters.q)}" aria-label="${t('search')}">
      <button class="btn pri" id="qgo" aria-label="${t('search')}">🔍</button>
    </div>
    <div class="chips" id="makechips">
      <button class="chip${!S.filters.make?' on':''}" data-m="">${t('all')}</button>
      ${S.makes.slice(0,24).map(m=>`<button class="chip${S.filters.make===m?' on':''}" data-m="${escH(m)}">${escH(m)}</button>`).join('')}
    </div>
    <div class="f2" style="margin-bottom:10px">
      <input id="f-year" type="number" inputmode="numeric" placeholder="${t('minyear')}" value="${escH(S.filters.min_year)}" aria-label="${t('minyear')}" style="border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px">
      <input id="f-price" type="number" inputmode="numeric" placeholder="${t('maxprice')}" value="${escH(S.filters.max_price)}" aria-label="${t('maxprice')}" style="border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px">
    </div>
    <div id="res" class="grid" aria-live="polite"></div>
    <div id="more" style="text-align:center;margin:14px 0"></div>`;
  const res=document.getElementById('res'), more=document.getElementById('more');
  let offset=null, loading=false;
  async function load(more2){
    if(loading) return; loading=true;
    try{
      const p=new URLSearchParams({q:S.filters.q,make:S.filters.make,min_year:S.filters.min_year,max_price:S.filters.max_price});
      if(more2&&offset) p.set('offset',offset);
      const j=await api('/listings?'+p.toString());
      if(!more2) res.innerHTML='';
      res.insertAdjacentHTML('beforeend', j.listings.map(cardHTML).join('') || (more2?'':`<div class="empty" style="grid-column:1/-1">${t('nolistings')}</div>`));
      offset=j.offset;
      more.innerHTML = offset?`<button class="btn" id="morebtn">↓ ${t('all')}</button>`:'';
      const mb=document.getElementById('morebtn'); if(mb) mb.onclick=()=>load(true);
    }catch(e){ if(!more2) res.innerHTML=`<div class="empty" style="grid-column:1/-1">⚠️</div>`; }
    loading=false;
  }
  const apply=()=>{ S.filters.q=document.getElementById('q').value.trim(); S.filters.min_year=document.getElementById('f-year').value; S.filters.max_price=document.getElementById('f-price').value; offset=null; load(false); };
  document.getElementById('qgo').onclick=apply;
  document.getElementById('q').addEventListener('keydown',(e)=>{ if(e.key==='Enter') apply(); });
  document.getElementById('f-year').addEventListener('keydown',(e)=>{ if(e.key==='Enter') apply(); });
  document.getElementById('f-price').addEventListener('keydown',(e)=>{ if(e.key==='Enter') apply(); });
  document.getElementById('makechips').addEventListener('click',(e)=>{
    const c=e.target.closest('.chip'); if(!c) return;
    S.filters.make=c.dataset.m; offset=null;
    document.querySelectorAll('#makechips .chip').forEach(x=>x.classList.toggle('on',x===c));
    load(false);
  });
  load(false);
}
</script>
<script>
'use strict';
/* ============ detail ============ */
async function vDetail(id){
  view.innerHTML=`<div class="empty">…</div>`;
  let l;
  try{ l=(await api('/listings/'+encodeURIComponent(id))).listing; }
  catch(e){ view.innerHTML=`<div class="empty">${t('nolistings')}</div>`; return; }
  const imgs = l.photos||[];
  const hero = imgs[0]?'/api/photo/'+imgs[0]:'';
  const ytid = ytId(l.youtube_url);
  const rows=[

/* ============ post / edit ============ */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const max=1400, sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      resolve({name:file.name,mime:'image/jpeg',data:c.toDataURL('image/jpeg',0.82).split(',')[1]});
      URL.revokeObjectURL(img.src);
    };
    img.onerror=reject; img.src=URL.createObjectURL(file);
  });
}

/* ============ auth modal wiring ============ */
function wireAuth(){
  document.getElementById('auth-btn').onclick=()=>{
    if(S.user){ fbAuth.signOut(); toast(t('logout')); } else openAuth();
  };
  document.getElementById('auth-close').onclick=closeAuth;
  document.getElementById('auth-modal').addEventListener('click',(e)=>{ if(e.target.id==='auth-modal') closeAuth(); });
  document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') closeAuth(); });
  const te=document.getElementById('tab-email'), tp=document.getElementById('tab-phone');
  te.onclick=()=>{ te.classList.add('pri'); tp.classList.remove('pri'); document.getElementById('pane-email').style.display=''; document.getElementById('pane-phone').style.display='none'; };
  tp.onclick=()=>{ tp.classList.add('pri'); te.classList.remove('pri'); document.getElementById('pane-phone').style.display=''; document.getElementById('pane-email').style.display='none'; };
  document.getElementById('link-signup').onclick=(e)=>{
    e.preventDefault();
    emailMode = emailMode==='login'?'signup':'login';
    document.getElementById('btn-email-go').textContent = emailMode==='login'?t('login'):t('noaccount').split('—')[1]||'Sign up';
    document.getElementById('link-signup').textContent = emailMode==='login'?t('noaccount'):t('haveaccount');
  };
  document.getElementById('btn-email-go').onclick=async ()=>{
    const email=document.getElementById('in-email').value.trim(), pass=document.getElementById('in-pass').value;
    if(!email||!pass) return;
    try{
      if(emailMode==='signup'){
        const c=await fbAuth.createUserWithEmailAndPassword(email,pass);
        await c.user.sendEmailVerification(); toast(t('verifyemail'));
      } else {
        await fbAuth.signInWithEmailAndPassword(email,pass);
      }
      closeAuth();
    }catch(e){ toast('⚠️ '+(e.message||e)); }
  };
  document.getElementById('btn-sms-go').onclick=async ()=>{
    const phone=document.getElementById('in-phone').value.trim();
    if(!phone) return;
    try{
      if(!window._recap) window._recap=new firebase.auth.RecaptchaVerifier('recaptcha',{size:'normal'});
      phoneConfirm=await fbAuth.signInWithPhoneNumber(phone, window._recap);
      document.getElementById('sms-code-wrap').style.display='';
      document.getElementById('btn-sms-verify').style.display='';
      toast('✓');
    }catch(e){ toast('⚠️ '+(e.message||e)); try{ window._recap.render(); }catch(_){} }
  };
  document.getElementById('btn-sms-verify').onclick=async ()=>{
    const code=document.getElementById('in-smscode').value.trim();
    if(!code||!phoneConfirm) return;
    try{ await phoneConfirm.confirm(code); closeAuth(); }
    catch(e){ toast('⚠️ '+(e.message||e)); }
  };
  document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.go)));
  document.getElementById('lang-hy').onclick=()=>{ LANG='hy'; localStorage.setItem('carlang','hy'); applyI18n(); route(); };
  document.getElementById('lang-en').onclick=()=>{ LANG='en'; localStorage.setItem('carlang','en'); applyI18n(); route(); };
}

(async function(){
  applyI18n(); wireAuth(); renderAuthBtn();
  const ok=await initFirebase();
  if(!ok) console.warn('firebase not configured');
  route();
})();
</script>
